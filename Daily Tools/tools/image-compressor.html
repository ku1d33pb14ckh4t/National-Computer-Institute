<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Real‑Time Image Compressor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============ GLOBAL ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background: #eef2ff;
      position: relative;
    }

    /* Animated colorful gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(-45deg, #ffd6e8, #d6e4ff, #d6fff1, #fff4d6, #f0d6ff);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Soft colorful orbs */
    body::after {
      content: '';
      position: fixed;
      z-index: -1;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(123, 47, 247, 0.35), transparent 65%);
      top: -180px;
      left: -180px;
      filter: blur(80px);
      animation: float1 14s ease-in-out infinite;
    }

    .orb-2 {
      position: fixed;
      z-index: -1;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35), transparent 65%);
      bottom: -180px;
      right: -180px;
      filter: blur(80px);
      animation: float2 16s ease-in-out infinite;
    }

    .orb-3 {
      position: fixed;
      z-index: -1;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 106, 0, 0.28), transparent 65%);
      top: 40%;
      right: 10%;
      filter: blur(90px);
      animation: float3 20s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(70px, 50px) scale(1.15); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, -50px) scale(1.12); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, 60px) scale(1.1); }
    }

    /* ============ GLASS CARD ============ */
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-radius: 32px;
      padding: 34px 38px 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        0 30px 70px rgba(80, 90, 180, 0.18),
        0 10px 25px rgba(80, 90, 180, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Gradient top accent */
    .app::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 4px;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(90deg, transparent, #7b2ff7, #00d2ff, #00f260, #ff6a00, transparent);
      opacity: 0.9;
    }

    /* ============ HEADER ============ */
    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #7b2ff7 0%, #00d2ff 40%, #00f260 75%, #ff6a00 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      animation: textShine 6s linear infinite;
    }

    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .header h1 i {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff6a00, #ffd93d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(255, 106, 0, 0.35));
    }

    .header p {
      color: #5a6285;
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    /* ============ UPLOAD ============ */
    .upload-zone {
      position: relative;
      border: 2px dashed rgba(123, 47, 247, 0.35);
      background: rgba(255, 255, 255, 0.55);
      border-radius: 22px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .upload-zone:hover {
      border-color: #7b2ff7;
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(123, 47, 247, 0.18);
    }

    .upload-zone.dragover {
      border-color: #00f260;
      background: rgba(0, 242, 96, 0.08);
      transform: scale(1.01);
      box-shadow: 0 15px 40px rgba(0, 242, 96, 0.25);
    }

    .upload-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      box-shadow: 0 12px 30px rgba(123, 47, 247, 0.35);
      transition: transform 0.3s;
    }

    .upload-zone:hover .upload-icon {
      transform: scale(1.08) rotate(-4deg);
    }

    .upload-icon i {
      font-size: 1.7rem;
      color: #fff;
    }

    .upload-zone p {
      color: #2a2f4a;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .upload-zone small {
      color: #8a91b5;
      font-size: 0.8rem;
      letter-spacing: 0.4px;
      font-weight: 500;
    }

    #fileInput { display: none; }

    /* ============ STATUS ============ */
    .status {
      margin: 14px 0 0;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.88rem;
      display: none;
      align-items: center;
      gap: 10px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status.show { display: flex; }

    .status.success {
      background: rgba(0, 242, 96, 0.12);
      border-left: 4px solid #00c853;
      color: #00701f;
    }

    .status.error {
      background: rgba(248, 87, 166, 0.12);
      border-left: 4px solid #f857a6;
      color: #a0145d;
    }

    .status.info {
      background: rgba(0, 210, 255, 0.12);
      border-left: 4px solid #00a3d2;
      color: #005a75;
    }

    /* ============ SIZE DASHBOARD ============ */
    .size-dashboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 14px;
      margin: 20px 0 18px;
      padding: 16px 22px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(80, 90, 180, 0.06);
    }

    .size-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .size-box .size-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #8a91b5;
    }

    .size-box .size-num {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .size-box.before .size-num {
      background: linear-gradient(135deg, #ff6a00, #f857a6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .size-box.after .size-num {
      background: linear-gradient(135deg, #00c853, #00a3d2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .size-divider {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(123, 47, 247, 0.15), rgba(0, 210, 255, 0.15));
      border: 1px solid rgba(123, 47, 247, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b2ff7;
      font-size: 0.85rem;
    }

    .savings-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .savings-badge .savings-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #8a91b5;
    }

    .savings-badge .savings-value {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff9800, #ff2d95);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .savings-badge .savings-value i {
      font-size: 1rem;
      color: #ff9800;
      -webkit-text-fill-color: #ff9800;
    }

    /* ============ CONTROLS ============ */
    .controls-panel {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 16px;
      padding: 20px 22px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(80, 90, 180, 0.06);
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #6b7295;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control label i {
      color: #7b2ff7;
      font-size: 0.75rem;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 7px;
      border-radius: 7px;
      background: linear-gradient(90deg, #f857a6 0%, #7b2ff7 50%, #00d2ff 100%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #7b2ff7;
      box-shadow: 0 0 12px rgba(123, 47, 247, 0.5), 0 0 0 4px rgba(123, 47, 247, 0.12);
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(123, 47, 247, 0.8), 0 0 0 6px rgba(123, 47, 247, 0.18);
    }

    input[type="range"]::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.05);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #7b2ff7;
      box-shadow: 0 0 12px rgba(123, 47, 247, 0.5);
      cursor: grab;
    }

    .quality-pill {
      min-width: 58px;
      text-align: center;
      padding: 5px 12px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      color: #fff;
      box-shadow: 0 4px 14px rgba(123, 47, 247, 0.4);
    }

    input[type="number"],
    select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(123, 47, 247, 0.15);
      background: rgba(255, 255, 255, 0.9);
      color: #2a2f4a;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
      width: 100%;
      font-family: inherit;
    }

    input[type="number"]:focus,
    select:focus {
      border-color: #7b2ff7;
      box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.15);
      background: #fff;
    }

    /* ============ PREVIEW ============ */
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .preview-card {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(80, 90, 180, 0.06);
    }

    .preview-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      opacity: 0.95;
    }

    .preview-card.before::before {
      background: linear-gradient(90deg, #ff6a00, #f857a6);
    }

    .preview-card.after::before {
      background: linear-gradient(90deg, #00f260, #00d2ff);
    }

    .preview-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(80, 90, 180, 0.14);
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .preview-head h3 {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-card.before .preview-head h3 { color: #e0522d; }
    .preview-card.after .preview-head h3 { color: #00a86b; }

    .preview-head h3 i { font-size: 0.9rem; }

    .preview-image-wrap {
      border-radius: 14px;
      overflow: hidden;
      background: #f4f6ff;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(123, 47, 247, 0.1);
    }

    .preview-image-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
    }

    .preview-info {
      margin-top: 12px;
      font-size: 0.78rem;
      color: #5a6285;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 10px;
      text-align: center;
      word-break: break-word;
      border: 1px solid rgba(123, 47, 247, 0.08);
      font-weight: 600;
    }

    /* ============ DOWNLOAD BUTTON ============ */
    .download-section {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 48px;
      border: none;
      border-radius: 60px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #7b2ff7 0%, #00d2ff 50%, #00f260 100%);
      background-size: 200% auto;
      box-shadow:
        0 12px 30px rgba(123, 47, 247, 0.4),
        0 5px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    .download-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.6s;
    }

    .download-btn:hover:not(:disabled)::before {
      left: 100%;
    }

    .download-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      background-position: 100% center;
      box-shadow:
        0 18px 45px rgba(123, 47, 247, 0.55),
        0 8px 25px rgba(0, 210, 255, 0.4);
    }

    .download-btn:active:not(:disabled) {
      transform: translateY(-1px) scale(0.99);
    }

    .download-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.4);
      box-shadow: 0 6px 15px rgba(123, 47, 247, 0.15);
    }

    .download-btn i {
      font-size: 1.15rem;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .controls-panel {
        grid-template-columns: 1fr 1fr;
      }
      .size-dashboard {
        grid-template-columns: 1fr auto 1fr;
      }
      .savings-badge {
        grid-column: 1 / -1;
        align-items: center;
        flex-direction: row;
        justify-content: center;
        gap: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(123, 47, 247, 0.12);
      }
    }

    @media (max-width: 700px) {
      .app { padding: 24px 18px; }
      .header h1 { font-size: 1.7rem; }
      .header h1 i { font-size: 1.5rem; }
      .preview-grid { grid-template-columns: 1fr; }
      .size-dashboard {
        grid-template-columns: 1fr;
        gap: 10px;
        text-align: center;
      }
      .size-divider { margin: 0 auto; }
      .size-box { align-items: center; }
      .savings-badge { align-items: center; }
    }

    @media (max-width: 500px) {
      .controls-panel { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.4rem; }
      .size-box .size-num { font-size: 1.2rem; }
      .download-btn { width: 100%; padding: 16px 24px; }
    }
  </style>
</head>
<body>

<div class="orb-2"></div>
<div class="orb-3"></div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>
      <i class="fas fa-bolt"></i>
      Real‑Time Compressor
    </h1>
    <p>Sirf quality slider ghumao — before/after turant dikhega</p>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadArea">
    <div class="upload-icon">
      <i class="fas fa-cloud-upload-alt"></i>
    </div>
    <p>Drop image or click to browse</p>
    <small>JPG · PNG · WebP · SVG</small>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Status -->
  <div class="status" id="status"></div>

  <!-- Size Dashboard -->
  <div class="size-dashboard">
    <div class="size-box before">
      <span class="size-label">Before</span>
      <span class="size-num" id="originalSizeDisplay">—</span>
    </div>
    <div class="size-divider">
      <i class="fas fa-arrow-right"></i>
    </div>
    <div class="size-box after">
      <span class="size-label">After</span>
      <span class="size-num" id="compressedSizeDisplay">—</span>
    </div>
    <div class="savings-badge">
      <span class="savings-label">Saved</span>
      <span class="savings-value">
        <i class="fas fa-chart-line"></i>
        <span id="ratioText">0%</span>
      </span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-panel">
    <div class="control">
      <label><i class="fas fa-sliders-h"></i> Quality</label>
      <div class="range-wrap">
        <input type="range" id="quality" min="5" max="100" value="70" step="1">
        <span class="quality-pill" id="qualityValue">70%</span>
      </div>
    </div>
    <div class="control">
      <label><i class="fas fa-arrows-alt-h"></i> Max Width</label>
      <input type="number" id="maxWidth" value="1200" min="50" max="6000">
    </div>
    <div class="control">
      <label><i class="fas fa-arrows-alt-v"></i> Max Height</label>
      <input type="number" id="maxHeight" value="1200" min="50" max="6000">
    </div>
    <div class="control">
      <label><i class="fas fa-file-export"></i> Format</label>
      <select id="outputFormat">
        <option value="image/jpeg">JPEG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
  </div>

  <!-- Preview Grid -->
  <div class="preview-grid">
    <div class="preview-card before">
      <div class="preview-head">
        <h3><i class="fas fa-image"></i> Before</h3>
      </div>
      <div class="preview-image-wrap">
        <img id="originalPreview" src="" alt="original" style="display:none;">
      </div>
      <div class="preview-info" id="originalInfo">No image loaded</div>
    </div>
    <div class="preview-card after">
      <div class="preview-head">
        <h3><i class="fas fa-compress"></i> After</h3>
      </div>
      <div class="preview-image-wrap">
        <img id="compressedPreview" src="" alt="compressed" style="display:none;">
      </div>
      <div class="preview-info" id="compressedInfo">Adjust quality to see result</div>
    </div>
  </div>

  <!-- Download Button -->
  <div class="download-section">
    <button class="download-btn" id="downloadBtn" disabled>
      <i class="fas fa-download"></i>
      Download Compressed Image
    </button>
  </div>
</div>

<script>
  (function(){
    // -------------------- DOM refs --------------------
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const originalPreview = document.getElementById('originalPreview');
    const compressedPreview = document.getElementById('compressedPreview');
    const originalInfo = document.getElementById('originalInfo');
    const compressedInfo = document.getElementById('compressedInfo');
    const qualitySlider = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const maxWidthInput = document.getElementById('maxWidth');
    const maxHeightInput = document.getElementById('maxHeight');
    const outputFormat = document.getElementById('outputFormat');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    const originalSizeDisplay = document.getElementById('originalSizeDisplay');
    const compressedSizeDisplay = document.getElementById('compressedSizeDisplay');
    const ratioText = document.getElementById('ratioText');

    // -------------------- state --------------------
    let originalFile = null;
    let originalImage = null;
    let compressedBlob = null;
    let compressedFileName = '';
    let currentObjectUrl = null;
    let realtimeTimer = null;

    // -------------------- helpers --------------------
    function formatSize(bytes) {
      if (bytes === undefined || bytes === null) return '—';
      if (bytes < 1024) return bytes + ' B';
      else if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
      else return (bytes/(1024*1024)).toFixed(2) + ' MB';
    }

    function showStatus(msg, type = 'info') {
      statusDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
      statusDiv.className = 'status show ' + type;
      clearTimeout(statusDiv._timer);
      statusDiv._timer = setTimeout(() => {
        statusDiv.classList.remove('show');
      }, 3500);
    }

    qualitySlider.addEventListener('input', () => {
      qualityValue.textContent = qualitySlider.value + '%';
    });

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => resolve({ img, dataUrl: e.target.result });
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressImage(img, quality, maxW, maxH, format) {
      return new Promise((resolve, reject) => {
        try {
          let width = img.width;
          let height = img.height;
          if (width > maxW) {
            height = Math.round((height * maxW) / width);
            width = maxW;
          }
          if (height > maxH) {
            width = Math.round((width * maxH) / height);
            height = maxH;
          }
          width = Math.max(1, Math.round(width));
          height = Math.max(1, Math.round(height));

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);

          const q = Math.min(1, Math.max(0.05, quality / 100));
          canvas.toBlob((blob) => {
            if (!blob) { reject(new Error('Canvas toBlob failed')); return; }
            resolve({ blob, width, height, mime: format });
          }, format, q);
        } catch (err) { reject(err); }
      });
    }

    async function updateCompressedPreview(blob, width, height, mime) {
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(blob);
      compressedPreview.src = currentObjectUrl;
      compressedPreview.style.display = 'block';

      const ext = mime.split('/')[1] || 'jpg';
      const baseName = originalFile ? originalFile.name.replace(/\.[^.]+$/, '') : 'image';
      compressedFileName = `${baseName}_compressed.${ext}`;
      compressedInfo.innerHTML = `<i class="fas fa-file-image"></i> ${compressedFileName} • ${width}×${height} • ${formatSize(blob.size)}`;

      compressedSizeDisplay.textContent = formatSize(blob.size);

      if (originalFile) {
        originalSizeDisplay.textContent = formatSize(originalFile.size);
        const savedPercent = Math.max(0, Math.round((1 - blob.size / originalFile.size) * 100));
        ratioText.textContent = savedPercent + '%';
      }

      compressedBlob = blob;
      downloadBtn.disabled = false;
    }

    async function triggerRealtimeCompress() {
      if (!originalImage || !originalFile) return;

      const quality = parseInt(qualitySlider.value, 10);
      const maxW = parseInt(maxWidthInput.value, 10) || 1200;
      const maxH = parseInt(maxHeightInput.value, 10) || 1200;
      const format = outputFormat.value;

      if (realtimeTimer) clearTimeout(realtimeTimer);
      realtimeTimer = setTimeout(async () => {
        try {
          const { blob, width, height, mime } = await compressImage(originalImage, quality, maxW, maxH, format);
          await updateCompressedPreview(blob, width, height, mime);
        } catch (err) {
          console.warn('Realtime compression error:', err);
        }
      }, 80);
    }

    qualitySlider.addEventListener('input', triggerRealtimeCompress);
    qualitySlider.addEventListener('change', triggerRealtimeCompress);
    maxWidthInput.addEventListener('input', triggerRealtimeCompress);
    maxWidthInput.addEventListener('change', triggerRealtimeCompress);
    maxHeightInput.addEventListener('input', triggerRealtimeCompress);
    maxHeightInput.addEventListener('change', triggerRealtimeCompress);
    outputFormat.addEventListener('change', triggerRealtimeCompress);

    // Upload handlers
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    uploadArea.addEventListener('drop', async (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) await handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', async (e) => {
      if (e.target.files.length) await handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showStatus('Please select an image file.', 'error');
        return;
      }
      originalFile = file;
      try {
        const { img, dataUrl } = await loadImageFromFile(file);
        originalImage = img;
        originalPreview.src = dataUrl;
        originalPreview.style.display = 'block';
        originalInfo.innerHTML = `<i class="fas fa-file-image"></i> ${file.name} • ${formatSize(file.size)} • ${img.width}×${img.height}`;
        originalSizeDisplay.textContent = formatSize(file.size);

        compressedPreview.style.display = 'none';
        compressedInfo.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating…';
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = null;
        }
        compressedBlob = null;
        compressedSizeDisplay.textContent = '—';
        ratioText.textContent = '0%';
        downloadBtn.disabled = true;

        await triggerRealtimeCompress();
        showStatus('Image loaded! Quality slider ghumao.', 'success');
      } catch (err) {
        console.error(err);
        showStatus('Failed to load image.', 'error');
      }
    }

    // Download
    downloadBtn.addEventListener('click', () => {
      if (!compressedBlob) {
        showStatus('No compressed image available.', 'error');
        return;
      }
      const url = URL.createObjectURL(compressedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = compressedFileName || 'compressed.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showStatus('Download started!', 'success');
    });

    // init
    qualityValue.textContent = qualitySlider.value + '%';
  })();
</script>
</body>
</html>
